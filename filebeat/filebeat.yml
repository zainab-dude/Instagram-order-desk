filebeat.inputs:
  - type: filestream
    id: docker-container-logs
    enabled: true
    paths:
      - /var/lib/docker/containers/*/*.log
    parsers:
      - container:
          stream: all
          format: docker
    processors:
      - add_docker_metadata:
          host: "unix:///var/run/docker.sock"
      - drop_event:
          when:
            not:
              or:
                - equals:
                    container.name: "observable-orders-app-a"
                - equals:
                    container.name: "observable-orders-app-b"
                - equals:
                    container.name: "observable-orders-app-c"
                - equals:
                    container.name: "observable-orders-grpc-a"
                - equals:
                    container.name: "observable-orders-grpc-b"
                - equals:
                    container.name: "observable-orders-grpc-c"
                - equals:
                    container.name: "observable-orders-envoy"
      - decode_json_fields:
          fields: ["message"]
          target: "json"
          overwrite_keys: false
          add_error_key: true
      - copy_fields:
          fields:
            - from: "json.service.name"
              to: "service.name"
            - from: "json.severity"
              to: "severity"
            - from: "json.request_id"
              to: "request_id"
            - from: "json.order_id"
              to: "order_id"
            - from: "json.message"
              to: "message"
            - from: "json.trace_id"
              to: "trace_id"
            - from: "json.replica"
              to: "replica"
            - from: "json.upstream_host"
              to: "upstream_host"
            - from: "json.interface"
              to: "envoy_interface"
            - from: "json.path"
              to: "envoy_path"
            - from: "json.response_code"
              to: "envoy_response_code"
            - from: "json.grpc_status"
              to: "envoy_grpc_status"
            - from: "json.duration_ms"
              to: "envoy_duration_ms"
            - from: "json.response_flags"
              to: "envoy_response_flags"
          fail_on_error: false
          ignore_missing: true
      # A3: replica identity from the container name (also covers non-JSON lines).
      - add_fields:
          when:
            equals:
              container.name: "observable-orders-app-a"
          target: ""
          fields:
            replica: "A"
      - add_fields:
          when:
            equals:
              container.name: "observable-orders-app-b"
          target: ""
          fields:
            replica: "B"
      - add_fields:
          when:
            equals:
              container.name: "observable-orders-app-c"
          target: ""
          fields:
            replica: "C"
      - add_fields:
          when:
            equals:
              container.name: "observable-orders-grpc-a"
          target: ""
          fields:
            replica: "A"
      - add_fields:
          when:
            equals:
              container.name: "observable-orders-grpc-b"
          target: ""
          fields:
            replica: "B"
      - add_fields:
          when:
            equals:
              container.name: "observable-orders-grpc-c"
          target: ""
          fields:
            replica: "C"
      - drop_fields:
          fields: ["json"]
          ignore_missing: true
      - add_fields:
          target: ""
          fields:
            pipeline: observable-orders-docker

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "observable-orders-v3-%{+yyyy.MM.dd}"

setup.template.name: "observable-orders-v3"
setup.template.pattern: "observable-orders-v3-*"
setup.template.priority: 300
setup.ilm.enabled: false

logging.level: info
logging.to_stderr: true
