global:
  scrape_interval: 15s
  evaluation_interval: 15s

# A3: Prometheus scrapes every replica and Envoy directly on the backend network,
# never through Envoy's balanced listeners. The replica identity is a static target label.
scrape_configs:
  - job_name: fastapi-app
    scrape_interval: 5s
    static_configs:
      - targets: ["app-a:8000"]
        labels: {replica: A}
      - targets: ["app-b:8000"]
        labels: {replica: B}
      - targets: ["app-c:8000"]
        labels: {replica: C}

  - job_name: grpc-service
    scrape_interval: 5s
    static_configs:
      - targets: ["grpc-a:8002"]
        labels: {replica: A}
      - targets: ["grpc-b:8002"]
        labels: {replica: B}
      - targets: ["grpc-c:8002"]
        labels: {replica: C}

  - job_name: envoy
    scrape_interval: 5s
    metrics_path: /stats/prometheus
    static_configs:
      - targets: ["envoy:9901"]

  - job_name: node-exporter
    scrape_interval: 15s
    static_configs:
      - targets: ["node-exporter:9100"]
