global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: fastapi-app
    scrape_interval: 15s
    static_configs:
      - targets: ["app:8000"]

  - job_name: node-exporter
    scrape_interval: 15s
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: grpc-service
    scrape_interval: 5s
    static_configs:
      - targets: ["grpc-service:8002"]